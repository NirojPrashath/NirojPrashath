name: Generate Snake
on:
  schedule: [{ cron: "0 0 * * *" }]   # daily
  workflow_dispatch:                   # run manually anytime
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: NirojPrashath
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=E10600&color_dots=120a0c,7b0410,e10600,ff3b30,ffd9d6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
