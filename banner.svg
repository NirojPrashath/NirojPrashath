<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" role="img" aria-label="Niroj Prashath — Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0709"/>
      <stop offset="0.55" stop-color="#070406"/>
      <stop offset="1" stop-color="#040203"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.85" r="0.9">
      <stop offset="0" stop-color="#e10600" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#7b0410" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7b0410" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ffd9d6"/>
      <stop offset="1" stop-color="#ff6a60"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e10600"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ff3c28" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>
    <rect width="1280" height="340" fill="url(#glow2)"/>

    <!-- decorative orbit rings on the right -->
    <g stroke="#ff3c28" fill="none" opacity="0.25">
      <circle cx="1035" cy="170" r="150" stroke-opacity="0.16"/>
      <circle cx="1035" cy="170" r="112" stroke-opacity="0.22" stroke-dasharray="3 7"/>
      <circle cx="1035" cy="170" r="74" stroke-opacity="0.3"/>
    </g>

    <!-- terminal window motif (right) -->
    <g transform="translate(915,92)">
      <rect x="0" y="0" width="240" height="156" rx="12" fill="#0a0607" stroke="#2a1416" stroke-width="1.5"/>
      <rect x="0" y="0" width="240" height="30" rx="12" fill="#120a0c"/>
      <rect x="0" y="16" width="240" height="14" fill="#120a0c"/>
      <circle cx="18" cy="15" r="5" fill="#ff5f56"/>
      <circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
      <circle cx="54" cy="15" r="5" fill="#27c93f"/>
      <text x="120" y="19" font-family="'SF Mono','Fira Code',Consolas,monospace" font-size="10" fill="#6b5a5c" text-anchor="middle">niroj@dev</text>
      <g font-family="'SF Mono','Fira Code',Consolas,monospace" font-size="11">
        <text x="16" y="58" fill="#6b5a5c">// build for the real world</text>
        <text x="16" y="80"><tspan fill="#ff8b8b">const</tspan><tspan fill="#f4eef0"> dev </tspan><tspan fill="#e10600">=</tspan><tspan fill="#f4eef0"> {</tspan></text>
        <text x="30" y="100"><tspan fill="#ff6a60">role</tspan><tspan fill="#f4eef0">: </tspan><tspan fill="#7fd6b0">'engineer'</tspan><tspan fill="#f4eef0">,</tspan></text>
        <text x="30" y="120"><tspan fill="#ff6a60">stack</tspan><tspan fill="#f4eef0">: </tspan><tspan fill="#7fd6b0">'full+mobile'</tspan></text>
        <text x="16" y="140" fill="#f4eef0">}<tspan fill="#e10600">;</tspan><tspan fill="#e10600">_</tspan></text>
      </g>
    </g>

    <!-- LEFT: identity -->
    <g transform="translate(78,86)">
      <g font-family="'Segoe UI','SF Pro Display',Helvetica,Arial,sans-serif">
        <!-- kicker -->
        <circle cx="6" cy="-4" r="5" fill="#e10600"/>
        <text x="22" y="0" font-size="15" letter-spacing="5" font-weight="700" fill="#ff3b30">SOFTWARE ENGINEER</text>
        <!-- name -->
        <text x="0" y="66" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#name)">NIROJ PRASHATH</text>
        <!-- rule -->
        <rect x="2" y="88" width="360" height="3" rx="2" fill="url(#rule)"/>
        <!-- subtitle -->
        <text x="0" y="126" font-size="20" font-weight="600" fill="#cbb8b8">Full-Stack Web · Android · Real-World Products</text>
        <!-- meta line -->
        <text x="0" y="160" font-family="'SF Mono','Fira Code',Consolas,monospace" font-size="14" fill="#8a7476">
          <tspan fill="#e10600">➜</tspan> NAITA
          <tspan fill="#3a2a2c"> · </tspan> ex-intern @ Proxima
          <tspan fill="#3a2a2c"> · </tspan> Sri Lanka
        </text>
      </g>
    </g>

    <!-- bottom accent bar -->
    <rect x="0" y="336" width="1280" height="4" fill="#e10600"/>
  </g>
</svg>
